# TRMNLP configuration
# {{ env.VARIABLE }} interpolation is available here
---
# auto-reload when files change (`watch: false` to disable)
watch:
  - .trmnlp.yml
  - src

# Values of the custom fields defined in src/settings.yml, read from the
# environment so the organization name stays out of version control.
custom_fields:
  organization: "{{ env.APPSIGNAL_ORGANIZATION }}"

time_zone: America/New_York

# override variables
variables:
  trmnl: {}
