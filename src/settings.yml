---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: latest
polling_url: https://appsignal.com/graphql
polling_headers: |-
  Content-Type: application/json
  Authorization: Bearer {{ oauth_access_token }}
  User-Agent: trmnl-appsignal (+https://github.com/indiebrain/trmnl-appsignal)
polling_body: '{"query":"query TrmnlAppsignal($organization: String!) { organization(slug: $organization) { apps { name environment openExceptions: exceptionIncidents(state: OPEN, limit: 100) { number } openPerformance: performanceIncidents(state: OPEN, limit: 100) { number } exceptionIncidents(state: OPEN, limit: 8, order: LAST) { number count lastOccurredAt exceptionName exceptionMessage namespace actionNames severity } performanceIncidents(state: OPEN, limit: 8, order: LAST) { number count lastOccurredAt namespace actionNames severity mean hasNPlusOne } uptimeMonitors { name url alerts { state } } checkIns { triggers { identifier kind lastState lastUpdateAt } } } } }","variables":{"organization":{{ organization | json }}}}'
name: AppSignal
description: Open AppSignal incidents
refresh_interval: 15
custom_fields:
- keyname: about
  name: About This Plugin
  field_type: author_bio
  category: analytics,programming
  description: >-
    Shows the open errors, slow actions, and uptime and check-in monitors of every app in an AppSignal organization, or of one app.<br/>
    <br/>
    <strong>Setup</strong><br/>
    1. Click the OAuth <strong>Connect</strong> button and sign in to AppSignal. AppSignal asks you to pick an app, but the plugin can read every app in the organization either way. The plugin only asks for read access, which you can revoke in AppSignal at any time.<br/>
    2. Fill in your organization name: the part after appsignal.com/ in the address bar when you open AppSignal. Leave App blank to see every app, or enter one app's name.<br/>
    3. Save, and add the plugin to a playlist.<br/>
    <br/>
    To see example data without connecting, enter <strong>demo</strong> as the organization.
  github_url: https://github.com/indiebrain/trmnl-appsignal
- keyname: organization
  name: Organization
  field_type: string
  description: The name after appsignal.com/ in the address bar when you open AppSignal (appsignal.com/ORGANIZATION/...). Enter demo to see example data.
  placeholder: example-org
- keyname: app
  name: App
  field_type: string
  optional: true
  description: >-
    Leave blank to show every app in the organization. To show one app, enter
    its name as AppSignal lists it; add the environment (my-app staging) to pick
    one environment.
  placeholder: All apps
oauth_enabled: 'true'
oauth_authorize_url: https://appsignal.com/oauth/authorize
oauth_token_url: https://appsignal.com/oauth/token
oauth_scopes: app:read
oauth_pkce_enabled: 'yes'
oauth_client_id: SSxE-b54Nak88428BadY9JQeDS0sck3JGgycXSIL2ho
