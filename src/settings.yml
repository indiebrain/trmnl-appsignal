---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: latest
polling_url: https://appsignal.com/graphql
polling_headers: |-
  Content-Type: application/json
  Authorization: Bearer {{ oauth_access_token }}
polling_body: '{"query":"query TrmnlAppsignal($appId: String!) { app(id: $appId) {
  id name environment openExceptions: exceptionIncidents(state: OPEN, limit: 100)
  { number } openPerformance: performanceIncidents(state: OPEN, limit: 100) { number
  } exceptionIncidents(state: OPEN, limit: 8, order: LAST) { number count lastOccurredAt
  exceptionName exceptionMessage namespace actionNames severity } performanceIncidents(state:
  OPEN, limit: 8, order: LAST) { number count lastOccurredAt namespace actionNames
  severity mean hasNPlusOne } uptimeMonitors { name url alerts { state } } } }","variables":{"appId":"{{
  app_id }}"}}'
name: AppSignal
description: Open AppSignal incidents
refresh_interval: 15
custom_fields:
- keyname: app_id
  name: App ID
  field_type: string
  description: The ID from the app's settings page, or from the address bar (appsignal.com/your-org/sites/APP_ID).
  placeholder: 5f0c3a9e8b1d2c4e6a7f9b10
oauth_enabled: 'true'
oauth_authorize_url: https://appsignal.com/oauth/authorize
oauth_token_url: https://appsignal.com/oauth/token
oauth_scopes: app:read
oauth_pkce_enabled: 'yes'
oauth_client_id: SSxE-b54Nak88428BadY9JQeDS0sck3JGgycXSIL2ho
