name: TRMNL
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Rewrite the snapshots in tests/snapshots and upload them
        type: boolean
        default: false

# The jobs only read the repository.
permissions:
  contents: read

env:
  # The trmnlp image the tests run in, pinned to the release mise.toml installs.
  TRMNLP_IMAGE: trmnl/trmnlp:v0.32.3

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "4.0"
      - run: gem install trmnl_preview -v 0.32.3
      - run: trmnlp lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: trmnlp test
        run: >
          docker run --rm -e CI=true -e GITHUB_STEP_SUMMARY=/summary.md
          -v "$PWD":/plugin -v "$GITHUB_STEP_SUMMARY":/summary.md "$TRMNLP_IMAGE"
          test --report report ${{ inputs.update_snapshots && '--update' || '' }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trmnlp-report
          path: report
      - if: ${{ inputs.update_snapshots }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshots
          path: tests/snapshots
